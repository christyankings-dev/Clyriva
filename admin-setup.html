<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Clyriva • Criar administrador</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#102e39,#145c61);font:15px system-ui,Segoe UI,Arial,sans-serif;color:#21434a}
main{max-width:470px;width:100%;background:#fff;padding:34px;border-radius:22px;box-shadow:0 25px 80px #071d2e44}
.logo{font-size:28px;font-weight:850;letter-spacing:-1.5px;color:#106c63;margin-bottom:14px}.logo span{color:#1dbda1}
h1{font-size:26px;letter-spacing:-.8px;line-height:1.15;margin:12px 0}p{color:#668085;line-height:1.65;font-size:13px}
label{display:block;color:#375b60;font-weight:650;font-size:13px;margin:19px 0 9px}
input{width:100%;padding:14px;border:1px solid #c6d7d4;border-radius:10px;font:inherit;outline:none}
input:focus{border-color:#19a18a;box-shadow:0 0 0 3px #19a18a22}
button,a.action{border:0;display:block;width:100%;padding:15px;text-align:center;border-radius:10px;background:#138778;color:#fff;text-decoration:none;font-weight:750;font:inherit;margin-top:24px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
.note{font-size:12px;color:#7d9194}.error{padding:12px;background:#fff0ed;color:#a33527;border-radius:9px;margin-top:15px}.success{padding:14px;background:#e7f8f1;color:#146546;border-radius:9px;margin-top:15px}
</style>
</head>
<body>
<main>
<div class="logo">clyriva<span>.</span></div>
<h1>Seu primeiro acesso de administrador</h1>
<p>Escolha o e-mail e a senha para administrar o Clyriva. Você poderá entrar imediatamente, sem precisar confirmar o endereço de e-mail.</p>
<form id="setup">
<label for="email">E-mail de administrador</label><input id="email" type="email" placeholder="seuemail@exemplo.com" autocomplete="username" required>
<label for="pass">Senha (mínimo 12 caracteres)</label><input id="pass" type="password" minlength="12" autocomplete="new-password" required>
<label for="repeat">Repita a senha</label><input id="repeat" type="password" minlength="12" autocomplete="new-password" required>
<button id="submit" type="submit">Criar meu login de administrador</button>
</form>
<div id="status" role="status" aria-live="polite"></div>
<p class="note">Este link de ativação funciona apenas uma vez. Não compartilhe o endereço. Sua senha nunca é enviada ao ChatGPT.</p>
</main>
<script>
(()=>{
'use strict';
const form=document.querySelector('#setup'), status=document.querySelector('#status');
const codigo=new URLSearchParams(location.hash.slice(1)).get('codigo');
if(!codigo){form.hidden=true;status.className='error';status.textContent='Link de ativação inválido. Abra o endereço exclusivo fornecido para seu administrador.';return;}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const email=document.querySelector('#email').value.trim().toLowerCase();
  const password=document.querySelector('#pass').value;
  const repeat=document.querySelector('#repeat').value;
  if(password!==repeat){status.className='error';status.textContent='As duas senhas precisam ser iguais.';return;}
  if(password.length<12){status.className='error';status.textContent='A senha deve ter no mínimo 12 caracteres.';return;}
  const btn=document.querySelector('#submit');btn.disabled=true;btn.textContent='Criando acesso…';status.textContent='';status.className='';
  try{
    const response=await fetch('https://qphpbsfzxouwtpaxkfky.supabase.co/functions/v1/clyriva-acessos/setup',{
      method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_vfSmfnnGRxjpNY0P5jaj2w_iNalvEn9'},
      body:JSON.stringify({codigo,email,password})
    });
    const result=await response.json();
    if(!response.ok||!result.ok)throw Error(result.error||'Não foi possível ativar o acesso.');
    history.replaceState(null,'',location.pathname);
    form.remove();status.className='success';
    status.innerHTML='<strong>Administrador criado!</strong><p>Entre no Clyriva com o e-mail e a senha que escolheu.</p><a class="action" href="/">Entrar no Clyriva</a>';
  }catch(error){status.className='error';status.textContent=error.message||'Falha ao criar o acesso.';}
  finally{btn.disabled=false;btn.textContent='Criar meu login de administrador';}
});
})();
</script>
</body>
</html>
