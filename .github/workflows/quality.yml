name: Clyriva - quality checks

on:
  pull_request:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and build the public site
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run build
      - name: Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax checks
        run: |
          node --experimental-strip-types --check edge-functions/clyriva-client/index.ts
          python -m compileall -q servidor.py tests/
      - name: Python unit and static regression checks (no real customer data)
        run: |
          for name in \
            attachments_v23_test.py audit_v22_test.py charge_reminders_test.py \
            cliente_test.py integrated_docs_v24_test.py integrity_v25_test.py \
            private_server_test.py pwa_test.py servidor_test.py; do
            python -m unittest discover -s tests -p "$name" -v
          done
      - name: JavaScript unit tests
        run: |
          node tests/core_private_test.mjs
          node tests/reminder_rules_test.mjs
          node tests/edge_integration_v22.mjs
          node tests/worker_navigation.mjs
      - name: Install headless browser dependencies
        run: |
          python -m pip install "playwright==1.56.0"
          sudo apt-get update -qq
          sudo apt-get install -y chromium
      - name: Isolated desktop and mobile UI regression
        run: |
          python tests/browser_management.py
          python tests/browser_billing_test.py
          python tests/browser_v22_test.py
          python tests/browser_documents_v23.py
          python tests/browser_agenda_v26.py
          python tests/browser_mobile_access.py

  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.67.1
      - name: Ciclo de duas empresas em uma instância Supabase descartável
        run: bash tests/run_supabase_local.sh
